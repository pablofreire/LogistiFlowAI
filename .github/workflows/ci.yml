name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore LogistiFlow.slnx
      - run: dotnet build LogistiFlow.slnx -c Release --no-restore
      - name: Unit and architecture tests
        run: |
          for project in tests/unit/*/*.csproj tests/architecture/*/*.csproj; do
            dotnet test --project "$project" -c Release --no-build --report-xunit-trx --results-directory TestResults
          done
      - name: Integration tests (Testcontainers PostgreSQL and RabbitMQ)
        run: dotnet test --project tests/integration/LogistiFlow.IntegrationTests -c Release --no-build --report-xunit-trx --results-directory TestResults
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'

  web:
    name: Web lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/logistiflow-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Web/logistiflow-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Playwright E2E against Docker Compose
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose --profile app up -d --build --wait
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-evidence
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            docs/evidence/e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color --tail 200

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # args feeds build-args, which is a newline-separated list.
        include:
          - image: orders-api
            dockerfile: deploy/docker/dotnet.Dockerfile
            args: |
              PROJECT=src/Services/Orders/LogistiFlow.Orders.Api
              ASSEMBLY=LogistiFlow.Orders.Api.dll
          - image: inventory-api
            dockerfile: deploy/docker/dotnet.Dockerfile
            args: |
              PROJECT=src/Services/Inventory/LogistiFlow.Inventory.Api
              ASSEMBLY=LogistiFlow.Inventory.Api.dll
          - image: fulfillment-api
            dockerfile: deploy/docker/dotnet.Dockerfile
            args: |
              PROJECT=src/Services/Fulfillment/LogistiFlow.Fulfillment.Api
              ASSEMBLY=LogistiFlow.Fulfillment.Api.dll
          - image: shipping-api
            dockerfile: deploy/docker/dotnet.Dockerfile
            args: |
              PROJECT=src/Services/Shipping/LogistiFlow.Shipping.Api
              ASSEMBLY=LogistiFlow.Shipping.Api.dll
          - image: aioperations-api
            dockerfile: deploy/docker/dotnet.Dockerfile
            args: |
              PROJECT=src/Services/AiOperations/LogistiFlow.AiOperations.Api
              ASSEMBLY=LogistiFlow.AiOperations.Api.dll
          - image: carrier-simulator
            dockerfile: deploy/docker/dotnet.Dockerfile
            args: |
              PROJECT=src/Simulators/LogistiFlow.CarrierSimulator
              ASSEMBLY=LogistiFlow.CarrierSimulator.dll
          - image: gateway
            dockerfile: deploy/docker/dotnet.Dockerfile
            args: |
              PROJECT=src/Gateway/LogistiFlow.Gateway
              ASSEMBLY=LogistiFlow.Gateway.dll
          - image: web
            dockerfile: deploy/docker/web.Dockerfile
            args: ''
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          push: false
          tags: logistiflow/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

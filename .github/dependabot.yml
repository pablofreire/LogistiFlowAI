version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      microsoft: { patterns: ['Microsoft.*', 'System.*'] }
      opentelemetry: { patterns: ['OpenTelemetry*'] }
      testing: { patterns: ['xunit*', 'NSubstitute', 'AwesomeAssertions', 'Testcontainers*', 'NetArchTest*'] }
  - package-ecosystem: npm
    directory: /src/Web/logistiflow-web
    schedule: { interval: weekly }
    groups:
      mantine: { patterns: ['@mantine/*'] }
      tooling: { patterns: ['eslint*', '@eslint/*', 'typescript*', 'vite', '@vitejs/*'] }
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }

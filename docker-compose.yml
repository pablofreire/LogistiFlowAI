name: logistiflow

# Local stack.
#   docker compose up -d --wait postgres rabbitmq          infrastructure only (run the services from the IDE)
#   docker compose --profile app up -d --build --wait      everything: http://localhost:8088 (web), :8089 (gateway API)
# Defaults are for local development only; override them in a .env file (see .env.example).

x-dotnet-build: &dotnet-build
  context: .
  dockerfile: deploy/docker/dotnet.Dockerfile

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Production
  Logging__Json: "true"
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__UserName: ${RABBITMQ_USER:-logistiflow}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-logistiflow_dev}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-development-signing-key-not-for-production}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logistiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistiflow_dev}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "${POSTGRES_PORT:-55450}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistiflow} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-logistiflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-logistiflow_dev}
    ports:
      - "${RABBITMQ_PORT:-5682}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15682}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Each service owns its database and applies its own migrations as an init step before it starts.
  orders-migrate:
    profiles: ["app"]
    image: logistiflow/orders-api:local
    build: { <<: *dotnet-build, args: { PROJECT: src/Services/Orders/LogistiFlow.Orders.Api, ASSEMBLY: LogistiFlow.Orders.Api.dll } }
    command: ["--migrate"]
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_orders;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
    depends_on: *depends-infra
    healthcheck: { disable: true }

  orders-api:
    profiles: ["app"]
    image: logistiflow/orders-api:local
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_orders;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
    depends_on:
      <<: *depends-infra
      orders-migrate:
        condition: service_completed_successfully

  inventory-migrate:
    profiles: ["app"]
    image: logistiflow/inventory-api:local
    build: { <<: *dotnet-build, args: { PROJECT: src/Services/Inventory/LogistiFlow.Inventory.Api, ASSEMBLY: LogistiFlow.Inventory.Api.dll } }
    command: ["--migrate", "--seed-demo"]
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_inventory;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
    depends_on: *depends-infra
    healthcheck: { disable: true }

  inventory-api:
    profiles: ["app"]
    image: logistiflow/inventory-api:local
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_inventory;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
    depends_on:
      <<: *depends-infra
      inventory-migrate:
        condition: service_completed_successfully

  fulfillment-migrate:
    profiles: ["app"]
    image: logistiflow/fulfillment-api:local
    build: { <<: *dotnet-build, args: { PROJECT: src/Services/Fulfillment/LogistiFlow.Fulfillment.Api, ASSEMBLY: LogistiFlow.Fulfillment.Api.dll } }
    command: ["--migrate"]
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_fulfillment;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
    depends_on: *depends-infra
    healthcheck: { disable: true }

  fulfillment-api:
    profiles: ["app"]
    image: logistiflow/fulfillment-api:local
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_fulfillment;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
    depends_on:
      <<: *depends-infra
      fulfillment-migrate:
        condition: service_completed_successfully

  gateway-migrate:
    profiles: ["app"]
    image: logistiflow/gateway:local
    build: { <<: *dotnet-build, args: { PROJECT: src/Gateway/LogistiFlow.Gateway, ASSEMBLY: LogistiFlow.Gateway.dll } }
    command: ["--migrate", "--seed-demo"]
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_identity;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
      DemoSeed__Password: ${DEMO_PASSWORD:-Demo-Password-2026!}
    depends_on: *depends-infra
    healthcheck: { disable: true }

  gateway:
    profiles: ["app"]
    image: logistiflow/gateway:local
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=logistiflow_identity;Username=${POSTGRES_USER:-logistiflow};Password=${POSTGRES_PASSWORD:-logistiflow_dev}
      Services__Orders: http://orders-api:8080
      Services__Inventory: http://inventory-api:8080
      Services__Fulfillment: http://fulfillment-api:8080
      RateLimiting__Login__PermitLimit: ${LOGIN_RATE_LIMIT:-30}
    ports:
      - "${GATEWAY_PORT:-8089}:8080"
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      orders-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      fulfillment-api:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: logistiflow/web:local
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
